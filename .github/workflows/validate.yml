name: DeepPCB grouped audit
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - uses: actions/checkout@v4
        with:
          repository: tangsanli5201/DeepPCB
          ref: 08e98c4db5922613fb97176eb3d6497d48260cb1
          path: dataset
          persist-credentials: false
      - run: python audit.py | tee deeppcb-audit.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: deeppcb-group-validation
          path: deeppcb-audit.txt
