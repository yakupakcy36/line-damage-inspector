name: Inspect and benchmark
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - uses: actions/checkout@v4
        with:
          repository: tangsanli5201/DeepPCB
          ref: 08e98c4db5922613fb97176eb3d6497d48260cb1
          path: dataset
          persist-credentials: false
      - run: python evaluate.py dataset/PCBData | tee report.json
        shell: bash
      - run: cat report.json >> "$GITHUB_STEP_SUMMARY"
      - run: python learned.py benchmark dataset/PCBData --model pcb.skops | tee learned-report.json
        shell: bash
      - run: cat learned-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Measure original detector without additional registration
        run: |
          python - <<'PY'
          import json
          from functools import partial
          from pathlib import Path
          from evaluate import evaluate
          from inspection import inspect
          print(json.dumps(evaluate(Path("dataset/PCBData"), partial(inspect, register=False))))
          PY
      - run: python audit.py
      - name: Stage and verify the standalone package
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/pcb-inspector"
          cp pcb.skops report.json learned-report.json group-validation.json learned.py inspection.py evaluate.py requirements.txt README.md "$RUNNER_TEMP/pcb-inspector/"
          sample=$(awk 'NR==1 {print $1}' dataset/PCBData/trainval.txt)
          base="$PWD/dataset/PCBData/${sample%.*}"
          cd "$RUNNER_TEMP/pcb-inspector"
          python learned.py predict pcb.skops "${base}_temp.jpg" "${base}_test.jpg" > "$RUNNER_TEMP/prediction.json"
          python -c 'import json,sys; p=json.load(open(sys.argv[1])); assert p["status"] == "suspect" and p["boxes"]' "$RUNNER_TEMP/prediction.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pcb-inspector
          path: ${{ runner.temp }}/pcb-inspector/
