name: PKU grouped study
on:
  push:
    branches: [study/pcb-dataset-2]
    paths: ['studies/pku/**', '.github/workflows/pku-study.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Download dataset on runner
        run: |
          curl -fLsS --retry 3 'https://api.kaggle.com/v1/datasets/download/akhatova/pcb-defects' -o /tmp/pku.zip
          echo 'e3afaf19c897816718978051b257570bb3a4876f9458bf9557f8a7eb38cb23d2  /tmp/pku.zip' | sha256sum -c
          unzip -q /tmp/pku.zip -d /tmp/pku
      - run: python studies/pku/coverage.py /tmp/pku | tee coverage.jsonl
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: pku-proposal-coverage
          path: coverage.jsonl

